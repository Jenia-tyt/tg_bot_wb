services:
  postgres:
    image: 'postgres:18.0'
    restart: always
    environment:
      POSTGRES_DB: '${PG_BD}'
      POSTGRES_USER: '${PG_USER}'
      POSTGRES_PASSWORD: '${PG_PASSWORD}'
    ports:
      - '7432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql'
      - './initdb:/docker-entrypoint-initdb.d'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -d ${PG_BD} -U ${PG_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-file: "2"
        max-size: "10m"

  tg-bot-wb-prod:
    image: ${DOCKER_IMAGE_NAME}:latest
    restart: always
    depends_on:
      - postgres
    environment:
      HOST: postgres:5432
      DB_NAME: '${PG_BD}'
      DB_USER: '${PG_USER}'
      DB_PASSWORD: '${PG_PASSWORD}'
      TELEGRAM_TOKEN: '${TELEGRAM_TOKEN}'
      LOGGING_LEVEL_ROOT: INFO
      SERVER_PORT: 9092
      CHAT_SUPPORT_ID: '${CHAT_SUPPORT_ID}'
    ports:
      - "9092:9092"
    volumes:
      - 'bot_data:/data'
    healthcheck:
      test: "curl --fail --silent http://tg-bot-wb-prod:9092/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      options:
        max-file: "2"
        max-size: "10m"

volumes:
  pgdata:
  bot_data:

